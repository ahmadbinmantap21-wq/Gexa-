<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gexa</title>
<style>
:root{--u:calc(min(100vw,520px)/560);--bg:#000000;--box:#16181c;--chip:#202327;--text:#e7e9ea;--sub:#a7abaf;--ph:#71767b;--pill:#eff3f4;--blue:#eff3f4}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{color:var(--text);font-family:"Google Sans","Product Sans","Figtree",Roboto,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{display:block}
.app{height:100%;width:min(100vw,520px);margin:0 auto;display:flex;flex-direction:column}
header{height:calc(80*var(--u));display:flex;align-items:center;justify-content:space-between;padding:0 calc(20*var(--u)) 0 calc(21*var(--u));flex:none}
.hb{width:calc(44*var(--u));height:calc(44*var(--u));display:grid;place-items:center}
header h1{font-size:calc(24*var(--u));font-weight:500;letter-spacing:calc(-.2*var(--u))}
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:0 calc(19*var(--u))}
.hero{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
.hero h2{margin-top:calc(18*var(--u));font-size:calc(51*var(--u));line-height:1;font-weight:500;letter-spacing:calc(-.6*var(--u))}
.hero p{margin-top:calc(17*var(--u));font-size:calc(21.5*var(--u));line-height:calc(28*var(--u));font-weight:400;color:var(--sub)}
.msgs{display:flex;flex-direction:column;gap:calc(16*var(--u));padding:calc(8*var(--u)) 0}
.m{max-width:85%;padding:calc(14*var(--u)) calc(20*var(--u));border-radius:calc(28*var(--u));font-size:calc(22*var(--u));line-height:1.45}
.me{align-self:flex-end;background:var(--chip);white-space:pre-wrap;overflow-wrap:anywhere}
.ai{align-self:flex-start}
.box{flex:none;border:1px solid #2f3336;margin:0 calc(19*var(--u)) calc(25*var(--u));background:var(--box);border-radius:calc(42*var(--u));padding:calc(28*var(--u)) calc(10*var(--u)) calc(11*var(--u)) calc(12*var(--u))}
textarea{display:block;width:100%;height:calc(30*var(--u));max-height:calc(120*var(--u));resize:none;border:0;background:none;color:var(--text);font:inherit;font-size:calc(21*var(--u));line-height:calc(30*var(--u));padding:0 calc(16*var(--u));caret-color:var(--text)}
textarea::placeholder{color:var(--ph)}
textarea:focus{outline:none}
.row{margin-top:calc(36*var(--u));display:flex;align-items:center;gap:calc(11*var(--u))}
.circ{width:calc(58*var(--u));height:calc(58*var(--u));border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
.circ.mic{width:calc(56*var(--u));height:calc(56*var(--u))}
.model{height:calc(54*var(--u));border-radius:calc(27*var(--u));background:var(--chip);display:flex;align-items:center;padding:0 calc(24*var(--u)) 0 calc(22*var(--u));gap:calc(10*var(--u));font-size:calc(20.5*var(--u));font-weight:500;white-space:nowrap;flex:none}
.sp{flex:1}
.model svg{flex:none}
.speak{height:calc(56*var(--u));width:calc(127*var(--u));border-radius:calc(28*var(--u));background:var(--pill);color:#111;display:flex;align-items:center;justify-content:center;gap:calc(10*var(--u));font-size:calc(20.5*var(--u));font-weight:500;flex:none}
.send{display:none;width:calc(56*var(--u));height:calc(56*var(--u));border-radius:50%;background:#eff3f4;place-items:center;flex:none}
.typing .send{display:grid}
.typing .speak{display:none}

.app{position:relative;overflow:hidden}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.drawer{position:absolute;top:0;bottom:0;left:0;width:calc(408*var(--u));background:#000000;z-index:10;display:flex;flex-direction:column;transform:translateX(-102%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.open .scrim{opacity:1;pointer-events:auto}
.open .drawer{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.dh{height:calc(78*var(--u));display:flex;align-items:center;padding-left:calc(24*var(--u));font-size:calc(27.5*var(--u));font-weight:500;flex:none}
.search{margin:calc(6*var(--u)) calc(20*var(--u)) 0 calc(21*var(--u));height:calc(65*var(--u));border-radius:calc(33*var(--u));background:#16181c;border:1px solid #2f3336;display:flex;align-items:center;padding:0 calc(16*var(--u)) 0 calc(20*var(--u));gap:calc(17*var(--u));flex:none}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:calc(21*var(--u))}
.search input::placeholder{color:#71767b}
.search input:focus{outline:none}
.nc{margin:calc(17*var(--u)) calc(14*var(--u)) 0 calc(15*var(--u));height:calc(81*var(--u));border-radius:calc(41*var(--u));background:#202327;display:flex;align-items:center;padding-left:calc(23*var(--u));gap:calc(27*var(--u));font-size:calc(22*var(--u));font-weight:500;flex:none}
.list{flex:1;min-height:0;overflow-y:auto}
.lab{margin-top:calc(27*var(--u));margin-bottom:calc(7.5*var(--u));padding-left:calc(24*var(--u));font-size:calc(19.5*var(--u));line-height:calc(28*var(--u));color:#71767b}
.it{height:calc(71*var(--u));display:flex;align-items:center;padding:0 calc(27*var(--u)) 0 calc(29*var(--u))}
.ti{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:calc(26*var(--u));font-size:calc(21.5*var(--u));text-align:left}
.ti span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb{width:calc(24*var(--u));height:calc(44*var(--u));display:grid;place-items:center}
.ft{border-top:1px solid #2f3336;padding:calc(18*var(--u)) 0 calc(16*var(--u));flex:none}
.fr{height:calc(76*var(--u));width:100%;display:flex;align-items:center;padding:0 calc(27*var(--u)) 0 calc(29*var(--u));gap:calc(26*var(--u));font-size:calc(21.5*var(--u));font-weight:500;text-align:left}
.fr span{flex:1}
.hidden{display:none!important}

.sett{position:absolute;inset:0;background:#000000;z-index:20;overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.sopen .sett{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sh{height:calc(80*var(--u));display:flex;align-items:center;padding-left:calc(19*var(--u));gap:calc(41*var(--u))}
.sh h1{font-size:calc(25*var(--u));font-weight:500}
.sl{margin:calc(15*var(--u)) 0 calc(6*var(--u)) calc(19*var(--u));font-size:calc(24*var(--u));line-height:calc(30*var(--u));color:#a7abaf}
.sg+.sl{margin-top:calc(27*var(--u))}
.sg{margin:0 calc(17*var(--u));background:#16181c;border:1px solid #2f3336;border-radius:calc(34*var(--u));overflow:hidden}
.sr{position:relative;min-height:calc(89*var(--u));display:flex;align-items:center;width:100%;padding:0 calc(22*var(--u)) 0 calc(27*var(--u));gap:calc(28*var(--u));text-align:left}
.sr+.sr::before{content:"";position:absolute;top:0;left:calc(24*var(--u));right:calc(24*var(--u));border-top:1px solid #2a2d31}
.tx{flex:1;min-width:0;padding:calc(16*var(--u)) 0}
.tx b{display:block;font-size:calc(22*var(--u));line-height:calc(30*var(--u));font-weight:500}
.tx small{display:block;margin-top:calc(3*var(--u));font-size:calc(17*var(--u));line-height:calc(22*var(--u));color:#71767b;white-space:nowrap}
.sw{width:calc(58*var(--u));height:calc(36*var(--u));border-radius:calc(18*var(--u));background:#3a3f44;position:relative;flex:none;margin-right:calc(-3*var(--u))}
.sw::after{content:"";position:absolute;top:calc(4*var(--u));left:calc(4*var(--u));width:calc(28*var(--u));height:calc(28*var(--u));border-radius:50%;background:#e7e9ea;transition:transform .2s}
.sw.on{background:#eff3f4}
.sw.on::after{transform:translateX(calc(22*var(--u)));background:#fff}

.login{position:absolute;inset:0;background:#000000;z-index:30;overflow-y:auto;transform:translateY(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.lopen .login{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.lh{height:calc(80*var(--u));display:flex;align-items:center;padding-left:calc(24*var(--u))}
.lb{padding:calc(99*var(--u)) calc(33*var(--u)) calc(60*var(--u));display:flex;flex-direction:column}
.lgo{display:flex;justify-content:center}
.lb h2{text-align:center;margin-top:calc(6*var(--u));font-size:calc(46*var(--u));line-height:1;font-weight:500;letter-spacing:calc(-.5*var(--u))}
.lb .st{text-align:center;margin-top:calc(10*var(--u));font-size:calc(22*var(--u));line-height:calc(30*var(--u));color:var(--sub)}
.fld{height:calc(76*var(--u));border-radius:calc(22*var(--u));background:#16181c;border:1px solid #2f3336;display:flex;align-items:center;padding:0 calc(24*var(--u)) 0 calc(25*var(--u));gap:calc(24*var(--u))}
.fld:focus-within{border-color:#eff3f4}
.fld input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;font-size:calc(21*var(--u))}
.fld input::placeholder{color:#71767b}
.fld input:focus{outline:none}
.fg{align-self:flex-end;margin-top:calc(23*var(--u));font-size:calc(20.5*var(--u));line-height:calc(30*var(--u));font-weight:500;color:#eff3f4}
.go{margin-top:calc(48*var(--u));height:calc(68*var(--u));border-radius:calc(34*var(--u));background:#eff3f4;color:#fff;font-size:calc(21*var(--u));font-weight:500}
.gg{margin-top:calc(24*var(--u));height:calc(68*var(--u));border-radius:calc(34*var(--u));border:1px solid #536471;display:flex;align-items:center;justify-content:center;gap:calc(22*var(--u));font-size:calc(21*var(--u));font-weight:500}
.rg{margin-top:calc(43*var(--u));text-align:center;font-size:calc(21*var(--u));line-height:calc(30*var(--u));color:var(--sub)}
.rg button{color:#eff3f4;font-weight:500}

.voice{position:absolute;inset:0;background:#000000;z-index:40;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.vopen .voice{opacity:1;visibility:visible;transition:opacity .25s,visibility 0s}
.vh{height:calc(110*var(--u));display:flex;align-items:center;padding-left:calc(23*var(--u));flex:none}
.orbw{position:relative;width:calc(454*var(--u));height:calc(454*var(--u));margin:calc(63*var(--u)) auto 0;flex:none;display:grid;place-items:center;transition:opacity .3s}
.r1,.r2,.b{position:absolute;border-radius:50%}
.r1{inset:0;background:#0a0a0a;animation:pulse 5s ease-in-out infinite alternate}
.r2{width:90.3%;height:90.3%;background:#101010;animation:pulse 5s ease-in-out -2.5s infinite alternate}
.b{width:calc(360*var(--u));height:calc(360*var(--u));opacity:.8;background:radial-gradient(closest-side,#000000 0,#000000 48%,rgba(50,50,50,.5) 76%,rgba(120,120,120,.7) 93%,rgba(235,235,235,.95) 99%,rgba(235,235,235,0) 100%)}
.b1{border-radius:41% 59% 52% 48%/58% 42% 58% 42%;animation:m1 7s ease-in-out infinite alternate,spin 22s linear infinite}
.b2{border-radius:56% 44% 39% 61%/43% 55% 45% 57%;animation:m2 9s ease-in-out infinite alternate,spin 30s linear infinite reverse}
.b3{border-radius:48% 52% 60% 40%/52% 47% 53% 48%;animation:m3 11s ease-in-out infinite alternate,spin 38s linear infinite}
@keyframes m1{to{border-radius:58% 42% 45% 55%/45% 58% 42% 55%}}
@keyframes m2{to{border-radius:42% 58% 57% 43%/57% 45% 55% 43%}}
@keyframes m3{to{border-radius:55% 45% 42% 58%/44% 56% 44% 56%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{to{transform:scale(1.03)}}
@keyframes bar{0%,100%{transform:scaleY(.72)}50%{transform:scaleY(1)}}
.vg{position:absolute;top:calc(163*var(--u));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:calc(240*var(--u))}
.bars{height:calc(72*var(--u));display:flex;align-items:center;gap:calc(10*var(--u))}
.bars i{display:block;width:calc(9*var(--u));border-radius:calc(5*var(--u));background:#eff3f4;animation:bar 1s ease-in-out infinite}
.bars i:nth-child(1),.bars i:nth-child(5){height:calc(24*var(--u))}
.bars i:nth-child(2),.bars i:nth-child(4){height:calc(44*var(--u));animation-delay:-.3s}
.bars i:nth-child(3){height:calc(72*var(--u));animation-delay:-.6s}
.bars i:nth-child(4){animation-delay:-.45s}.bars i:nth-child(5){animation-delay:-.15s}
.vs{margin-top:calc(19*var(--u));text-align:center;font-size:calc(21.5*var(--u));line-height:calc(32*var(--u));font-weight:600}
.tr{margin-top:calc(70*var(--u));padding:0 calc(30*var(--u));text-align:center;font-size:calc(30*var(--u));line-height:calc(40*var(--u));min-height:calc(80*var(--u))}
.tr span{opacity:0;transition:opacity .35s}
.tr span.on{opacity:1}
.vc{margin-top:auto;display:flex;justify-content:space-between;padding:0 calc(66*var(--u)) calc(74*var(--u))}
.vb{display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u));font-size:calc(19*var(--u));color:#e7e9ea}
.vb i{width:calc(98*var(--u));height:calc(98*var(--u));border-radius:50%;background:#202327;display:grid;place-items:center}
.vb.red i{background:#ee3b32}
.vmuted .orbw{opacity:.45}
.vmuted .b,.vmuted .r1,.vmuted .r2,.vmuted .bars i{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.b,.r1,.r2,.bars i{animation:none!important}}
.blob{position:absolute;width:calc(400*var(--u));height:calc(400*var(--u));overflow:visible}
.blob path{fill:url(#bgr);opacity:.8}

/* Tombol + jadi × dan sheet "Tambahkan ke chat" */
.box{transition:margin-bottom .32s cubic-bezier(.32,.72,0,1)}
.popen .box{margin-bottom:calc(14*var(--u))}
#plus svg{transition:transform .32s cubic-bezier(.32,.72,0,1)}
.popen #plus svg{transform:rotate(45deg)}
.pwrap{flex:none;height:0;overflow:hidden;visibility:hidden;transition:height .32s cubic-bezier(.32,.72,0,1),visibility 0s .32s}
.popen .pwrap{visibility:visible;transition:height .32s cubic-bezier(.32,.72,0,1),visibility 0s}
.psheet{background:#000000;border:1px solid #2f3336;border-bottom:0;border-radius:calc(46*var(--u)) calc(46*var(--u)) 0 0;padding:calc(12*var(--u)) calc(19*var(--u)) calc(22*var(--u));max-height:72vh;overflow-y:auto}
.phandle{width:calc(56*var(--u));height:calc(8*var(--u));border-radius:calc(4*var(--u));background:#2f3336;margin:0 auto}
.phead{position:relative;height:calc(88*var(--u));margin-top:calc(7*var(--u));display:flex;align-items:center;justify-content:center;font-size:calc(25.5*var(--u));font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(12*var(--u));margin-top:calc(17*var(--u))}
.pcard{height:calc(162*var(--u));border-radius:calc(26*var(--u));background:#202327;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(12*var(--u));font-size:calc(23*var(--u));font-weight:500}
.pic{width:calc(68*var(--u));height:calc(68*var(--u));border-radius:50%;background:#2f3336;display:grid;place-items:center;flex:none}
.prow{width:100%;height:calc(98*var(--u));margin-top:calc(18*var(--u));border-radius:calc(26*var(--u));background:#202327;display:flex;align-items:center;gap:calc(15*var(--u));padding:0 calc(22*var(--u)) 0 calc(18*var(--u));text-align:left}
.prow .pic{width:calc(62*var(--u));height:calc(62*var(--u))}
.prow .tx{padding:0}
.prow .tx b{font-size:calc(26*var(--u));line-height:calc(32*var(--u))}
.prow .tx small{font-size:calc(22*var(--u));line-height:calc(28*var(--u));margin-top:0;color:#71767b}

/* Sheet "Model Gexa" */
.mscrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:7}
.mopen .mscrim{opacity:1;pointer-events:auto}
.msheet{position:absolute;left:0;right:0;bottom:0;height:68%;background:#000000;border-radius:calc(46*var(--u)) calc(46*var(--u)) 0 0;z-index:8;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s .32s}
.mopen .msheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s}
.mhead{position:relative;height:calc(132*var(--u));flex:none;display:flex;align-items:center;justify-content:center;font-size:calc(25.5*var(--u));font-weight:600}
.mhead .hb{position:absolute;left:calc(17*var(--u))}
.mlist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:calc(3*var(--u));padding:0 calc(19*var(--u)) calc(22*var(--u))}
.mrow{flex:none;height:calc(87*var(--u));display:flex;align-items:center;gap:calc(14*var(--u));padding:0 calc(19*var(--u));background:#202327;border-radius:calc(6*var(--u));font-size:calc(28*var(--u));font-weight:500;text-align:left}
.mrow:first-child{border-radius:calc(26*var(--u)) calc(26*var(--u)) calc(6*var(--u)) calc(6*var(--u))}
.mrow:last-child{border-radius:calc(6*var(--u)) calc(6*var(--u)) calc(26*var(--u)) calc(26*var(--u))}
.mrow:active{background:#2a2d31}
.mbadge{font-style:normal;font-size:calc(17*var(--u));font-weight:600;line-height:calc(19*var(--u));color:#eff3f4;background:#202327;border-radius:calc(16*var(--u));padding:calc(6*var(--u)) calc(12*var(--u))}

/* Sheet "Pilih model" (tampilan pertama saat tombol Model ditekan) */
.qopen .mscrim{opacity:1;pointer-events:auto}
.qsheet{position:absolute;left:0;right:0;bottom:0;max-height:68%;background:#000000;border-radius:calc(46*var(--u)) calc(46*var(--u)) 0 0;z-index:8;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s .32s}
.qopen .qsheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:0 calc(19*var(--u)) calc(22*var(--u))}
.qgrp{display:flex;flex-direction:column;gap:calc(3*var(--u))}
.qgrp:empty{display:none}
.qgrp:empty+.prow{margin-top:0}
.qgrp+.prow{margin-top:calc(20*var(--u))}
.qrow{display:flex;align-items:center;gap:calc(14*var(--u));padding:calc(15*var(--u)) calc(22*var(--u)) calc(15*var(--u)) calc(19*var(--u));background:#202327;border-radius:calc(6*var(--u));text-align:left}
.qrow:first-child{border-radius:calc(26*var(--u)) calc(26*var(--u)) calc(6*var(--u)) calc(6*var(--u))}
.qrow:last-child{border-radius:calc(6*var(--u)) calc(6*var(--u)) calc(26*var(--u)) calc(26*var(--u))}
.qrow:only-child{border-radius:calc(26*var(--u))}
.qrow:active{background:#2a2d31}
.qt{flex:1;min-width:0}
.qn{display:flex;align-items:center;gap:calc(12*var(--u));font-size:calc(26.5*var(--u));line-height:calc(34*var(--u));font-weight:500}
.qd{display:block;margin-top:calc(2*var(--u));font-size:calc(22.5*var(--u));line-height:calc(32*var(--u));color:#71767b}
.qsel .qn,.qsel .qd{color:var(--blue)}
.prow .tx small.qb{color:var(--blue)}

/* Balasan AI */
.box{position:relative}
.tst{position:absolute;left:calc(12*var(--u));right:calc(10*var(--u));top:calc(24*var(--u));height:calc(38*var(--u));display:none;align-items:center;gap:calc(14*var(--u));padding-left:calc(16*var(--u));background:var(--box);border-radius:calc(19*var(--u));font-size:calc(21*var(--u));color:#a7abaf}
.tst.on{display:flex}
.tst svg{width:calc(26*var(--u));height:calc(26*var(--u));flex:none}
.stop{display:none;height:calc(56*var(--u));width:calc(56*var(--u));border-radius:50%;background:var(--pill);color:#111;align-items:center;justify-content:center;flex:none}
.stop i{width:calc(17*var(--u));height:calc(17*var(--u));border-radius:calc(3*var(--u));background:#111}
.busy .stop{display:flex}

const SYSTEM_PROMPT=`Kamu adalah Gexa, asisten AI yang ramah, cerdas, dan membantu. Gaya bicaramu natural seperti teman yang pintar: hangat, jelas, dan tidak kaku.

- Tebalkan istilah atau poin penting secukupnya.
- Kode selalu di dalam code block dengan nama bahasanya, harus lengkap dan siap dijalankan, lalu diikuti penjelasan singkat.
- Boleh menutup dengan satu kalimat tawaran bantuan lanjutan yang relevan, bukan pertanyaan basa-basi.

KEJUJURAN DAN KEAMANAN:
- Jangan mengarang fakta, angka, atau sumber. Kalau tidak yakin atau tidak tahu, katakan terus terang.
- Untuk topik kesehatan, hukum, dan keuangan, beri informasi yang berguna dan sebutkan kapan perlu bertanya ke profesional.
- Tolak permintaan yang berbahaya dengan sopan dan singkat, lalu tawarkan alternatif yang aman.
- Jika pengguna meminta gambar dan fitur gambar tidak tersedia, katakan jujur; jangan pura-pura membuatnya.
- Kamu adalah Gexa. Jangan mengaku sebagai produk atau model AI lain.`;
